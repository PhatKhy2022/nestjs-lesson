<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Senior NestJS + Prisma + PostgreSQL Study Roadmap</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #202124;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px;
    }
    h1 { margin-bottom: 6px; }
    .subtitle { color: #666; margin-top: 0; }
    .card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin: 16px 0;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }
    .progress-wrap {
      background: #e8eaed;
      height: 14px;
      border-radius: 20px;
      overflow: hidden;
      margin: 12px 0;
    }
    .progress {
      height: 100%;
      width: 0;
      background: #1a73e8;
      transition: width .2s;
    }
    .stats {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
    }
    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    button, select, input {
      font: inherit;
    }
    button {
      border: 0;
      border-radius: 8px;
      padding: 9px 13px;
      cursor: pointer;
    }
    .primary { background: #1a73e8; color: white; }
    .secondary { background: #e8eaed; }
    .danger { background: #fce8e6; color: #b3261e; }
    input, select {
      border: 1px solid #dadce0;
      border-radius: 8px;
      padding: 9px 11px;
      background: white;
    }
    .phase {
      border-top: 1px solid #eee;
      padding: 18px 0;
    }
    .phase:first-child { border-top: 0; }
    .phase-title {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }
    .phase-title h2 { margin: 0; font-size: 19px; }
    .phase-title small { color: #777; }
    .phase-meta { display: flex; align-items: center; gap: 12px; flex: none; }
    .lesson-link {
      background: #e8f0fe;
      color: #1a73e8;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
    }
    .task {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 9px 0;
    }
    .task input[type="checkbox"] {
      margin-top: 4px;
      transform: scale(1.15);
    }
    .task-content { flex: 1; }
    .task-title { font-weight: 600; }
    .task-note {
      color: #777;
      font-size: 13px;
      margin-top: 3px;
    }
    .completed .task-title {
      text-decoration: line-through;
      color: #888;
    }
    .custom-task {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .custom-task input { flex: 1; }
    .hidden { display: none; }
    .empty { color: #777; text-align: center; padding: 25px; }
    @media (max-width: 600px) {
      .container { padding: 14px; }
      .phase-title { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🐘 Senior NestJS + Prisma + PostgreSQL Study Roadmap</h1>
    <p class="subtitle">Track your progress from TypeScript/NestJS fundamentals to production-level backend engineering.</p>

    <div class="card">
      <div class="stats">
        <span id="progressText">0 / 0 completed</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-wrap">
        <div id="progressBar" class="progress"></div>
      </div>
    </div>

    <div class="card">
      <div class="toolbar">
        <select id="filter">
          <option value="all">All tasks</option>
          <option value="active">Incomplete</option>
          <option value="completed">Completed</option>
        </select>
        <input id="search" type="search" placeholder="Search topics..." />
        <button class="secondary" id="resetProgress">Reset progress</button>
        <button class="danger" id="clearAll">Delete all data</button>
      </div>

      <div id="roadmap"></div>

      <div class="custom-task">
        <input id="customInput" placeholder="Add your own study task..." />
        <button class="primary" id="addCustom">Add task</button>
      </div>
    </div>
  </div>

<script>
const STORAGE_KEY = "seniorNestJSStudyTodo_v1";

const defaultData = [
  {
    phase: "1. TypeScript Mastery",
    goal: "Become comfortable writing TypeScript without copying patterns blindly.",
    tasks: [
      ["Variables and types", "let, const, type inference, strict mode"],
      ["Interfaces vs types", "know when to use each and why"],
      ["Functions", "optional/default params, overloads, arrow functions"],
      ["Generics", "generic functions, classes and constraints"],
      ["Union & intersection types", "narrowing and discriminated unions"],
      ["Enums", "numeric, string and const enums"],
      ["OOP", "classes, constructors, access modifiers"],
      ["Inheritance", "extends, super, abstract classes"],
      ["Structural typing", "implements, interfaces as contracts"],
      ["Decorators", "class, method, property and parameter decorators"],
      ["Async TypeScript", "Promise, async/await, error handling"],
      ["Utility types", "Partial, Pick, Omit, Record, Required"],
      ["Modules", "import/export, namespaces, barrel files"],
      ["tsconfig", "strict flags, paths, module resolution"]
    ]
  },
  {
    phase: "2. NestJS Fundamentals",
    goal: "Understand what NestJS is doing instead of only memorizing decorators.",
    tasks: [
      ["Modules", "@Module, imports, exports, providers"],
      ["Controllers", "routing, @Get/@Post/@Param/@Body"],
      ["Providers & services", "@Injectable and business logic separation"],
      ["Dependency injection", "constructor injection and provider scopes"],
      ["Request lifecycle", "middleware → guards → interceptors → pipes → handler"],
      ["Middleware", "custom middleware and applying it to routes"],
      ["Exception filters", "custom exceptions and global error handling"],
      ["Pipes", "validation pipes and transformation pipes"],
      ["Guards", "route protection and custom guards"],
      ["Interceptors", "logging and response transformation"],
      ["Custom decorators", "param decorators and metadata"],
      ["Configuration", "ConfigModule and environment variables"],
      ["Circular dependencies", "forwardRef and module design"]
    ]
  },
  {
    phase: "3. PostgreSQL Fundamentals",
    goal: "Understand the relational database underneath the ORM.",
    tasks: [
      ["Relational model", "tables, rows, columns, relationships"],
      ["SQL basics", "SELECT, WHERE, ORDER BY, LIMIT"],
      ["Joins", "INNER, LEFT, RIGHT and FULL joins"],
      ["Aggregation", "GROUP BY, HAVING, COUNT, SUM"],
      ["Keys", "primary keys, foreign keys, composite keys"],
      ["Indexes", "when and why to index a column"],
      ["Constraints", "NOT NULL, UNIQUE, CHECK, DEFAULT"],
      ["Transactions", "ACID, COMMIT, ROLLBACK"],
      ["Normalization", "1NF, 2NF, 3NF and denormalization trade-offs"],
      ["Views", "simplify complex or repeated queries"]
    ]
  },
  {
    phase: "4. Prisma ORM",
    goal: "Model data confidently and query it without guessing.",
    tasks: [
      ["Prisma schema", "datasource, generator and models"],
      ["Field types", "scalars, optional fields, default values"],
      ["Migrations", "prisma migrate dev and migrate deploy"],
      ["Relations", "one-to-one, one-to-many, many-to-many"],
      ["Prisma Client", "generated types and end-to-end type safety"],
      ["Queries", "findMany, findUnique, include, select"],
      ["Filtering & pagination", "where, skip, take, cursor"],
      ["Mutations", "create, update, upsert, delete"],
      ["Transactions", "$transaction and interactive transactions"],
      ["Seeding", "seed scripts for local and test data"],
      ["Prisma Studio", "inspecting and editing data visually"],
      ["Raw queries", "know when it's safe to drop to raw SQL"]
    ]
  },
  {
    phase: "5. Architecture",
    goal: "Learn to design maintainable NestJS applications.",
    tasks: [
      ["Layered architecture", "controller, service, repository"],
      ["Repository pattern", "isolate Prisma from business logic"],
      ["DTOs", "class-validator and class-transformer"],
      ["Feature modules", "organize by domain, not by file type"],
      ["Domain layer", "separate business rules from infrastructure"],
      ["Mapper pattern", "entity vs DTO vs domain model"],
      ["SOLID", "each principle with practical NestJS examples"],
      ["DI design", "avoid tight coupling between modules"],
      ["Architecture trade-offs", "avoid unnecessary over-engineering"]
    ]
  },
  {
    phase: "6. REST API Design",
    goal: "Design APIs that are predictable and easy to consume.",
    tasks: [
      ["REST principles", "resources, verbs and statelessness"],
      ["Status codes", "200, 201, 400, 401, 403, 404, 409, 422, 500"],
      ["Request validation", "class-validator with pipes"],
      ["Pagination", "offset-based vs cursor-based pagination"],
      ["Filtering & sorting", "designing query parameters"],
      ["Error response design", "a consistent error shape"],
      ["API versioning", "URI, header or media-type versioning"],
      ["Swagger / OpenAPI", "@nestjs/swagger documentation"],
      ["Idempotency", "safe retries for POST/PUT requests"]
    ]
  },
  {
    phase: "7. Authentication & Authorization",
    goal: "Protect resources and know exactly who is doing what.",
    tasks: [
      ["Password hashing", "bcrypt or argon2"],
      ["JWT", "access tokens and refresh tokens"],
      ["Passport strategies", "local strategy and jwt strategy"],
      ["Guards", "AuthGuard and custom guards"],
      ["RBAC", "role-based and permission-based access control"],
      ["Refresh token rotation", "handling expiry securely"],
      ["Session vs token auth", "know the trade-offs"],
      ["OAuth basics", "third-party login flows"]
    ]
  },
  {
    phase: "8. Testing",
    goal: "Be confident changing code without breaking existing behavior.",
    tasks: [
      ["Unit tests", "Jest fundamentals"],
      ["Testing services", "mocking Prisma and repositories"],
      ["Testing controllers", "mocking providers"],
      ["e2e tests", "Supertest and TestingModule"],
      ["Test database", "isolated test data strategy"],
      ["Mocking", "jest.mock and manual mocks"],
      ["Test edge cases", "validation errors, empty states, auth failures"],
      ["Test coverage", "use coverage as a signal, not the only goal"]
    ]
  },
  {
    phase: "9. Performance & Debugging",
    goal: "Find the real cause of problems instead of guessing.",
    tasks: [
      ["Query optimization", "avoid N+1 with include/select"],
      ["Indexing strategy", "match indexes to real query patterns"],
      ["Connection pooling", "understand Prisma connection limits"],
      ["Caching", "Redis for hot or expensive data"],
      ["Rate limiting", "@nestjs/throttler"],
      ["Logging", "structured logs and correlation IDs"],
      ["Debugging process", "reproduce → hypothesize → test → fix → verify"],
      ["Profiling", "find slow queries and slow endpoints"]
    ]
  },
  {
    phase: "10. Security",
    goal: "Protect users and application data.",
    tasks: [
      ["Input validation", "sanitize and validate all input"],
      ["SQL injection prevention", "parameterized queries via Prisma"],
      ["CORS", "configuring allowed origins"],
      ["Helmet", "secure HTTP headers"],
      ["Environment secrets", ".env management and secret storage"],
      ["HTTPS", "understand secure API communication"],
      ["Sensitive logs", "never expose tokens, passwords or secrets"],
      ["Brute force protection", "rate limiting sensitive endpoints"]
    ]
  },
  {
    phase: "11. Git, CI/CD & Production",
    goal: "Deliver and maintain production applications.",
    tasks: [
      ["Git branching", "branch, merge, rebase and conflict resolution"],
      ["Code review", "review for correctness, maintainability and risk"],
      ["Pull requests", "write clear PR descriptions"],
      ["Docker", "containerizing a NestJS + PostgreSQL app"],
      ["CI", "automatically lint and test code"],
      ["CD", "automatically build and deploy"],
      ["Production migrations", "safe database migration strategy"],
      ["Environment configs", "dev, staging and production"],
      ["Monitoring", "error tracking and uptime checks"]
    ]
  },
  {
    phase: "12. Senior Engineering Mindset",
    goal: "Move from writing code to owning technical decisions.",
    tasks: [
      ["Trade-offs", "compare simplicity, flexibility, performance and cost"],
      ["Code ownership", "understand the whole feature, not only your file"],
      ["Technical debt", "identify and prioritize debt"],
      ["Refactoring", "improve code without changing behavior"],
      ["Documentation", "document important decisions and complex behavior"],
      ["Mentoring", "explain concepts clearly to junior developers"],
      ["System thinking", "understand frontend, backend, database and deployment"],
      ["Failure design", "think about what happens when everything goes wrong"],
      ["Production thinking", "design for real users, not only the happy path"]
    ]
  }
];

// Lesson page for each phase, keyed by the phase number ("1. TypeScript Mastery" → 1).
// Looked up by number so it also works for progress already saved in localStorage.
const LESSONS = {
  1: "TypeScript-Mastery.html",
  2: "NestJS-Fundamentals.html",
  3: "PostgreSQL-Fundamentals.html",
  4: "Prisma-ORM.html",
  5: "Architecture.html",
  6: "REST-API-Design.html",
  7: "Authentication-and-Authorization.html",
  8: "Testing.html",
  9: "Performance-and-Debugging.html",
  10: "Security.html",
  11: "Git-CICD-and-Production.html",
  12: "Senior-Engineering-Mindset.html"
};

function lessonFor(phase) {
  const match = phase.phase.match(/^(\d+)\./);
  return match ? LESSONS[match[1]] : null;
}

let data = loadData();

function loadData() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (!saved) return defaultData.map(p => ({
    ...p,
    tasks: p.tasks.map(t => ({ title: t[0], note: t[1], completed: false, custom: false }))
  }));

  try {
    return JSON.parse(saved);
  } catch {
    return defaultData.map(p => ({
      ...p,
      tasks: p.tasks.map(t => ({ title: t[0], note: t[1], completed: false, custom: false }))
    }));
  }
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function render() {
  const roadmap = document.getElementById("roadmap");
  const filter = document.getElementById("filter").value;
  const search = document.getElementById("search").value.toLowerCase().trim();

  roadmap.innerHTML = "";

  let total = 0;
  let completed = 0;
  let visibleTasks = 0;

  data.forEach((phase, phaseIndex) => {
    const phaseTasks = phase.tasks.filter(task => {
      const matchesFilter =
        filter === "all" ||
        (filter === "active" && !task.completed) ||
        (filter === "completed" && task.completed);

      const matchesSearch =
        !search ||
        task.title.toLowerCase().includes(search) ||
        task.note.toLowerCase().includes(search) ||
        phase.phase.toLowerCase().includes(search);

      return matchesFilter && matchesSearch;
    });

    total += phase.tasks.length;
    completed += phase.tasks.filter(t => t.completed).length;
    visibleTasks += phaseTasks.length;

    if (phaseTasks.length === 0) return;

    const section = document.createElement("section");
    section.className = "phase";

    const title = document.createElement("div");
    title.className = "phase-title";
    title.innerHTML = `
      <div>
        <h2>${escapeHtml(phase.phase)}</h2>
        <small>${escapeHtml(phase.goal)}</small>
      </div>
      <div class="phase-meta">
        ${lessonFor(phase) ? `<a class="lesson-link" href="${lessonFor(phase)}">📖 Open lesson</a>` : ""}
        <small>${phase.tasks.filter(t => t.completed).length}/${phase.tasks.length}</small>
      </div>
    `;
    section.appendChild(title);

    phaseTasks.forEach(task => {
      const realIndex = phase.tasks.indexOf(task);
      const row = document.createElement("div");
      row.className = "task " + (task.completed ? "completed" : "");

      row.innerHTML = `
        <input type="checkbox" ${task.completed ? "checked" : ""} aria-label="Complete task">
        <div class="task-content">
          <div class="task-title">${escapeHtml(task.title)}</div>
          <div class="task-note">${escapeHtml(task.note)}</div>
        </div>
        ${task.custom ? '<button class="danger delete-task">Delete</button>' : ""}
      `;

      row.querySelector("input").addEventListener("change", e => {
        data[phaseIndex].tasks[realIndex].completed = e.target.checked;
        saveData();
        render();
      });

      const deleteButton = row.querySelector(".delete-task");
      if (deleteButton) {
        deleteButton.addEventListener("click", () => {
          data[phaseIndex].tasks.splice(realIndex, 1);
          saveData();
          render();
        });
      }

      section.appendChild(row);
    });

    roadmap.appendChild(section);
  });

  if (visibleTasks === 0) {
    roadmap.innerHTML = '<div class="empty">No tasks found.</div>';
  }

  const percent = total ? Math.round((completed / total) * 100) : 0;
  document.getElementById("progressText").textContent = `${completed} / ${total} completed`;
  document.getElementById("progressPercent").textContent = `${percent}%`;
  document.getElementById("progressBar").style.width = `${percent}%`;
}

function addCustomTask() {
  const input = document.getElementById("customInput");
  const title = input.value.trim();
  if (!title) return;

  data[0].tasks.push({
    title,
    note: "Personal study task",
    completed: false,
    custom: true
  });

  input.value = "";
  saveData();
  render();
}

function escapeHtml(value) {
  return value.replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  }[char]));
}

document.getElementById("filter").addEventListener("change", render);
document.getElementById("search").addEventListener("input", render);
document.getElementById("addCustom").addEventListener("click", addCustomTask);

document.getElementById("customInput").addEventListener("keydown", e => {
  if (e.key === "Enter") addCustomTask();
});

document.getElementById("resetProgress").addEventListener("click", () => {
  if (!confirm("Reset all study progress?")) return;

  data.forEach(phase => {
    phase.tasks.forEach(task => task.completed = false);
  });

  saveData();
  render();
});

document.getElementById("clearAll").addEventListener("click", () => {
  if (!confirm("Delete all saved study data and restore the default roadmap?")) return;

  localStorage.removeItem(STORAGE_KEY);
  data = loadData();
  render();
});

render();
</script>
</body>
</html>

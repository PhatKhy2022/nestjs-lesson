# The company's filing room: a PostgreSQL database in Docker.
# Start it with `npm run db:up` (or `docker compose up -d db`).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports:
      # host:container. Host port 5433 because a local PostgreSQL may already use 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
